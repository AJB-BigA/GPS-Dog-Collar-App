[tool.poetry]
name = "gps-server"
version = "0.1.0"
description = "FastAPI GPS server for device tracking and geofencing"
authors = ["Austin Baker <a.j.baker249@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.111.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
sqlalchemy = "^2.0.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.1"
httpx = { version = "^0.28.0", extras = ["http2"] }
PyJWT = { version = "^2.8.0", extras = ["cryptography"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
black = "^24.4.0"
isort = "^5.13.0"

[tool.pytest.ini_options]
testpaths = ["test_main.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
